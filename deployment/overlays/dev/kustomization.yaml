apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: union-api

resources:
- ../../base

configMapGenerator:
- files:
  - config.yaml
  name: union-api-config
  options:
    disableNameSuffixHash: true

patches:
- path: patches/serviceaccount.yaml
- path: patches/httproute.yaml

images:
- name: union-api
  newName: europe-west1-docker.pkg.dev/nav-data-images-prod/dataplattform-infra/union-api
  newTag: c411c1b
